name: FYnixorStudio-RDP
on:
  workflow_dispatch:
env:
  RDP_USERNAME: YOKOTO
  RDP_PASSWORD: FYnixor87654321!
  TG_TOKEN: 8593403659:AAGHthMyf-4MfbF4_eeOoJSab1YDk-dgSso
  TG_CHAT: "7016045840"
  HEARTBEAT_MINUTES: 15
jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 350
    steps:
      - name: Setup Helper Functions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\actions | Out-Null
          $helperScript = @'
          function Send-TelegramMessage {
              param(
                  [Parameter(Mandatory=$true)][string]$Token,
                  [Parameter(Mandatory=$true)][string]$ChatId,
                  [Parameter(Mandatory=$true)][string]$Text,
                  [int]$MaxRetries = 3
              )
              $uri = "https://api.telegram.org/bot$Token/sendMessage"
              $body = @{
                  chat_id = $ChatId
                  text = $Text
                  parse_mode = "HTML"
                  disable_web_page_preview = $true
              }
              $attempt = 0
              while ($attempt -lt $MaxRetries) {
                  try {
                      $resp = Invoke-RestMethod -Uri $uri -Method Post -Body $body -TimeoutSec 15
                      if ($resp.ok) { return $true }
                  } catch {
                      Write-Host "Telegram send gagal (percobaan $($attempt+1)): $($_.Exception.Message)"
                  }
                  $attempt++
                  Start-Sleep -Seconds 3
              }
              Write-Host "WARNING: Gagal kirim pesan Telegram setelah $MaxRetries percobaan."
              return $false
          }
          function Get-AsciiBanner {
              param([string]$Subtitle = "REMOTE ACCESS SESSION")
              return @"
          <code>
          ╭─────────────────────────────────╮
          │                                   │
          │      ⚡ F Y N I X O R  S T U D I O ⚡      │
          │          $Subtitle
          │                                   │
          ╰─────────────────────────────────╯
          </code>
          "@
          }
          function Get-SystemInfoBlock {
              $os = Get-CimInstance Win32_OperatingSystem
              $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1
              $disk = Get-PSDrive C
              $freeGB = [math]::Round($disk.Free / 1GB, 1)
              $totalGB = [math]::Round(($disk.Used + $disk.Free) / 1GB, 1)
              $ramTotalGB = [math]::Round($os.TotalVisibleMemorySize / 1MB, 1)
              $ramFreeGB = [math]::Round($os.FreePhysicalMemory / 1MB, 1)
              return @"
          🖥 <b>OS</b>       : $($os.Caption)
          ⚙️ <b>CPU</b>      : $($cpu.Name)
          🧠 <b>RAM</b>      : $ramFreeGB GB free / $ramTotalGB GB total
          💾 <b>Disk C:</b>  : $freeGB GB free / $totalGB GB total
          "@
          }
          function Format-Duration {
              param([TimeSpan]$Span)
              return "{0}j {1}m {2}d" -f [int]$Span.TotalHours, $Span.Minutes, $Span.Seconds
          }
          '@
          Set-Content -Path C:\actions\helpers.ps1 -Value $helperScript -Encoding UTF8
          Write-Host "Helper functions saved to C:\actions\helpers.ps1"
      - name: Notify - Provisioning Started
        shell: pwsh
        run: |
          . C:\actions\helpers.ps1
          $banner = Get-AsciiBanner -Subtitle "⏳ SEDANG DI-SETUP..."
          $msg = "$banner`n🚀 Runner GitHub Actions mulai provisioning RDP.`nTunggu ±1-2 menit buat kredensial lengkap."
          Send-TelegramMessage -Token $env:TG_TOKEN -ChatId $env:TG_CHAT -Text $msg | Out-Null
      - name: Configure Core RDP Settings
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-FYnixor" | Out-Null
          netsh advfirewall firewall add rule name="RDP-FYnixor" `
            dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force
          Write-Host "RDP core settings applied."
      - name: Create RDP User (Hardcoded Credentials)
        shell: pwsh
        run: |
          $securePass = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          if (Get-LocalUser -Name $env:RDP_USERNAME -ErrorAction SilentlyContinue) {
              Set-LocalUser -Name $env:RDP_USERNAME -Password $securePass
              Write-Host "User $($env:RDP_USERNAME) sudah ada, password di-reset."
          } else {
              New-LocalUser -Name $env:RDP_USERNAME -Password $securePass -AccountNeverExpires
              Add-LocalGroupMember -Group "Administrators" -Member $env:RDP_USERNAME
              Add-LocalGroupMember -Group "Remote Desktop Users" -Member $env:RDP_USERNAME
              Write-Host "User $($env:RDP_USERNAME) baru dibuat."
          }
          if (-not (Get-LocalUser -Name $env:RDP_USERNAME)) {
              Write-Error "User creation failed"
              exit 1
          }
      - name: Install cloudflared
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\cloudflared | Out-Null
          $exeUrl = "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe"
          Invoke-WebRequest -Uri $exeUrl -OutFile "C:\cloudflared\cloudflared.exe"
          Write-Host "cloudflared installed."
      - name: Start Cloudflare TCP Tunnel
        shell: pwsh
        run: |
          Start-Process -FilePath "C:\cloudflared\cloudflared.exe" `
            -ArgumentList "tunnel --url tcp://localhost:3389" `
            -RedirectStandardOutput "C:\cloudflared\cf-log.txt" `
            -RedirectStandardError "C:\cloudflared\cf-err.txt" `
            -WindowStyle Hidden
          Start-Sleep -Seconds 10

          $cfHostname = $null
          $retries = 0
          while (-not $cfHostname -and $retries -lt 10) {
              if (Test-Path "C:\cloudflared\cf-err.txt") {
                  $content = Get-Content "C:\cloudflared\cf-err.txt" -Raw
                  if ($content -match 'https://([a-z0-9\-]+\.trycloudflare\.com)') {
                      $cfHostname = $matches[1]
                  }
              }
              if (-not $cfHostname) { Start-Sleep -Seconds 3 }
              $retries++
          }

          if (-not $cfHostname) {
              Write-Host "===== ISI LOG CLOUDFLARED ====="
              if (Test-Path "C:\cloudflared\cf-log.txt") { Get-Content "C:\cloudflared\cf-log.txt" }
              if (Test-Path "C:\cloudflared\cf-err.txt") { Get-Content "C:\cloudflared\cf-err.txt" }
              Write-Error "Gagal dapetin hostname Cloudflare Tunnel. Cek log di atas."
              exit 1
          }

          echo "CF_HOSTNAME=$cfHostname" >> $env:GITHUB_ENV
          Write-Host "Cloudflare Tunnel aktif: $cfHostname"
      - name: Verify RDP Accessibility
        shell: pwsh
        run: |
          $testResult = Test-NetConnection -ComputerName 127.0.0.1 -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to local RDP port 3389 failed"
              exit 1
          }
          Write-Host "RDP lokal aktif, siap diteruskan lewat Cloudflare Tunnel."
      - name: Notify - Session Ready (Full Credentials)
        shell: pwsh
        run: |
          . C:\actions\helpers.ps1
          $banner = Get-AsciiBanner -Subtitle "✅ SESSION AKTIF"
          $sysInfo = Get-SystemInfoBlock
          $msg = @"
          $banner
          ✅ <b>RDP siap dipakai!</b>
          🌐 <b>Tunnel Hostname</b>
          <code>$env:CF_HOSTNAME</code>
          👤 <b>Username</b>
          <code>$env:RDP_USERNAME</code>
          🔑 <b>Password</b>
          <code>$env:RDP_PASSWORD</code>
          ────────────────────
          $sysInfo
          ────────────────────
          ℹ️ <b>Cara connect (customer):</b>
          1. Download cloudflared: <code>github.com/cloudflare/cloudflared/releases/latest</code>
          2. Buka terminal, jalanin:
          <code>cloudflared access tcp --hostname $env:CF_HOSTNAME --url localhost:3390</code>
          3. Buka app RD Client, connect ke <code>localhost:3390</code> pake username/password di atas.
          ⏱ Sesi ini otomatis mati di ~350 menit.
          "@
          Send-TelegramMessage -Token $env:TG_TOKEN -ChatId $env:TG_CHAT -Text $msg | Out-Null
      - name: Maintain Connection (Watchdog + Heartbeat)
        shell: pwsh
        run: |
          . C:\actions\helpers.ps1
          $startTime = Get-Date
          $heartbeatMinutes = [int]$env:HEARTBEAT_MINUTES
          $lastHeartbeat = $startTime
          $failCount = 0
          $maxFailBeforeAlert = 2
          Write-Host "Watchdog started. Heartbeat tiap $heartbeatMinutes menit."
          while ($true) {
              Start-Sleep -Seconds 60
              $now = Get-Date
              $elapsed = $now - $startTime

              $tunnelAlive = $false
              try {
                  $proc = Get-Process cloudflared -ErrorAction SilentlyContinue
                  if ($proc) { $tunnelAlive = $true }
              } catch {}

              if (-not $tunnelAlive) {
                  $failCount++
                  Write-Host "[$now] cloudflared process gak kedetect! ($failCount)"
                  if ($failCount -ge $maxFailBeforeAlert) {
                      $alertMsg = "⚠️ <b>PERINGATAN</b>`nCloudflare Tunnel FYnixorStudio kedetect mati.`nDurasi berjalan: $(Format-Duration $elapsed)"
                      Send-TelegramMessage -Token $env:TG_TOKEN -ChatId $env:TG_CHAT -Text $alertMsg | Out-Null
                      $failCount = 0
                  }
              } else {
                  $failCount = 0
              }

              if (($now - $lastHeartbeat).TotalMinutes -ge $heartbeatMinutes) {
                  $remaining = [TimeSpan]::FromMinutes(350) - $elapsed
                  $sysInfo = Get-SystemInfoBlock
                  $hbMsg = @"
          💓 <b>Heartbeat - FYnixorStudio RDP</b>
          🟢 Status: Alive
          📍 Hostname: <code>$env:CF_HOSTNAME</code>
          ⏱ Uptime: $(Format-Duration $elapsed)
          ⏳ Sisa waktu: $(Format-Duration $remaining)
          $sysInfo
          "@
                  Send-TelegramMessage -Token $env:TG_TOKEN -ChatId $env:TG_CHAT -Text $hbMsg | Out-Null
                  $lastHeartbeat = $now
                  Write-Host "[$now] Heartbeat terkirim."
              }
          }
      - name: Notify - Session Ended
        if: always()
        shell: pwsh
        run: |
          . C:\actions\helpers.ps1
          $banner = Get-AsciiBanner -Subtitle "🔴 SESSION BERAKHIR"
          $status = "${{ job.status }}"
          $msg = "$banner`n🔴 <b>Sesi RDP FYnixorStudio berakhir.</b>`nStatus job: <b>$status</b>`nRunner dimatikan / workflow selesai / dibatalkan."
          Send-TelegramMessage -Token $env:TG_TOKEN -ChatId $env:TG_CHAT -Text $msg | Out-Null